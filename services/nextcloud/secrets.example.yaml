# The sops keys this service expects, with throwaway values.
#
# Copy the shape into the host's secrets.yaml and `sops updatekeys`. The two
# aliased entries are NOT independent: see SKILL.md.

nextcloud:
    adminpass: replace-me
    sso:
        secret: replace-me
    # ldap_admin_password is NOT here on purpose: it aliases lldap/user_password
    # via settings.key, and a second value would silently break LDAP binding.

restic:
    nextcloud: replace-me

# authelia/nextcloud_sso_secret likewise aliases nextcloud/sso/secret.
