# What tooling can know about this service without evaluating any Nix.
#
# `ryra search` reads a folder; it does not instantiate a NixOS configuration.
# Facts here are therefore duplicated from service.nix on purpose. The rule for
# which facts: anything the MECHANISM needs before it can import the module
# (option-root, shb-module), plus anything a human or an agent needs in order
# to choose the service at all. Never a value the module already computes:
# the data directory comes from the module's `mount` output, so it is not here
# and cannot drift.

[service]
name = "nextcloud"
summary = "Files, calendar and contacts"
category = "productivity"
url = "https://nextcloud.com"

# Where this service's options live. NOT derivable from anything else:
# selfhostblocks' nextcloud-server.nix declares `shb.nextcloud`, and the
# mechanism reaches <option-root>.backup and <option-root>.mount to wire the
# restic instance and the ZFS dataset.
option-root = ["shb", "nextcloud"]

# The selfhostblocks module implementing this. A registry entry is allowed to
# be a thin wiring of an upstream module, and should be: the rule we inherit
# from SHB is "the smallest amount of code above what already exists". Drop
# this key when the entry stops needing it, and nothing at the host changes.
shb-module = "nextcloud-server"

# Contracts this service takes part in. The mechanism reads these to decide
# what to wire; they are not documentation.
ssl = true
backup = true
stateful = true
owner = "nextcloud"
group = "nextcloud"

# Blocks the host must already have configured for this to evaluate. Checked
# by nothing yet: this is the list an agent reads before adding the service, so
# it fails while writing the config rather than at the end of a rebuild.
needs = ["ssl", "secrets", "backup", "ldap", "oidc", "postgresql"]
provides = []

# Secrets this service requests, as sops keys. Documentation only: the
# authority is the `.request` lines in service.nix, which the module system
# checks. This exists so the keys can be put in secrets.yaml BEFORE the first
# rebuild fails on a missing one.
[secrets]
"nextcloud/adminpass" = "Nextcloud admin account password"
"nextcloud/sso/secret" = "OIDC client secret, shared with Authelia"
"restic/nextcloud" = "Restic repository passphrase (requested by the mechanism)"

# Two logical secrets that must resolve to ONE value, via `settings.key`.
# Generating independent values for these produces a service that starts
# cleanly, passes every health check, and cannot log anybody in.
[secrets.aliases]
"nextcloud/ldap_admin_password" = "lldap/user_password"
"authelia/nextcloud_sso_secret" = "nextcloud/sso/secret"
