# The sops keys this service expects, with throwaway values.
#
# `linkding-admin` is an ENV FILE, not a password: it is handed to systemd as
# an EnvironmentFile, so it must contain KEY=value lines. A bare password here
# produces a service that starts and has no account you can log in to.
#
# `restic-linkding` is requested by the mechanism, not by this service, and it
# appears for every service that backs up.

linkding:
    admin: |
        LD_SUPERUSER_NAME=admin
        LD_SUPERUSER_PASSWORD=replace-me

restic:
    linkding: replace-me
