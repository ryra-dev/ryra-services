# Checks for nextcloud, run against a machine that is already serving.
#
# Every step here only READS. That is not a convention: `[[tests.checks]]`
# refuses to deserialize an `add` or a `remove`, so a destructive check cannot
# be written down. On NixOS installing is a deploy (`nixos-rebuild`), not a
# test step.
#
# `$SERVICE_URL` is the app address from /etc/ryra/apps.json.

[[tests]]
name = "nextcloud"

# The units the service actually needs. phpfpm is the one that serves; nginx is
# shared, but a check that skips it reports a healthy Nextcloud on a box where
# nothing can reach it.
[[tests.checks]]
action = "wait"
unit = "phpfpm-nextcloud.service"
timeout = 60

[[tests.checks]]
action = "wait"
unit = "nginx.service"
timeout = 60

# 302 rather than 200: an unauthenticated GET redirects to the login flow.
# Asserting 200 here would mean asserting that Nextcloud does NOT require a
# login, which is the opposite of what we want to be true.
[[tests.checks]]
action = "http"
name = "answers on its own url"
url = "$SERVICE_URL/"
status = 302
poll = { interval = 3, attempts = 10 }

# Reachable through the reverse proxy AND reachable at all: status.php answers
# without a session, so a 200 here separates "nginx is up" from "php is up".
[[tests.checks]]
action = "http"
name = "status.php answers"
url = "$SERVICE_URL/status.php"
status = 200
poll = { interval = 3, attempts = 10 }

[[tests.checks]]
action = "shell"
name = "database setup finished"
run = "sudo nextcloud-occ status --output=json | grep -q '\"installed\":true'"
timeout = 60

# The service owns the path. Btrfs protects its parent state subvolume on the
# low-memory base; an optional ZFS provider may make this path its own dataset.
# That provider policy belongs to a machine check rather than this service.
[[tests.checks]]
action = "shell"
name = "state directory has the service ownership"
run = "sudo test -d /var/lib/nextcloud && test \"$(sudo stat -c %U:%G /var/lib/nextcloud)\" = nextcloud:nextcloud"

# A backup that has never produced a snapshot is not a backup. Reads only: it
# lists what restic already has rather than taking a new one.
[[tests.checks]]
action = "shell"
name = "restic snapshot includes files and the database"
run = "sudo ryra-backup-nextcloud exec snapshots | grep -F /var/lib/nextcloud >/dev/null && sudo ryra-backup-nextcloud exec ls latest /var/lib/nextcloud/.ryra-backup/database.dump | grep -F '/var/lib/nextcloud/.ryra-backup/database.dump' >/dev/null"
timeout = 60
